# Render Blueprint - Pharmacy Management System (microservices)
# NOTE: Secrets are NOT stored here. They are set via env var groups / Render dashboard.
# SERVICE_URLS contain onrender.com placeholders; replace with actual URLs after creating services.

envVarGroups:
  - name: pharmacy-secrets
    secretFiles: []

services:
  - type: web
    name: eureka-server
    runtime: image
    image:
      url: rahman5187/eureka-server:3.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8761"
      - key: EUREKA_HOSTNAME
        value: eureka-server.onrender.com

  - type: web
    name: api-gateway
    runtime: image
    image:
      url: rahman5187/api-gateway:3.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: api-gateway.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,https://pharmacy-frontend.onrender.com

  - type: web
    name: user-service
    runtime: image
    image:
      url: rahman5187/user-service:3.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8081"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: user-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://AIVEN-HOST:PORT/pharmacy_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: order-service
    runtime: image
    image:
      url: rahman5187/order-service:3.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8082"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: order-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://AIVEN-HOST:PORT/order_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        value: fuji.lmq.cloudamqp.com
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VIRTUAL_HOST
        sync: false
      - key: RABBITMQ_SSL_ENABLED
        value: "true"
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false

  - type: web
