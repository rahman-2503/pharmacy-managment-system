# Render Blueprint - Pharmacy Management System (microservices)
# Fresh deployment spec (v4.0.0). Secrets are NOT stored here; set them in the
# Render dashboard / service env vars after creation.

envVarGroups:
  - name: pharmacy-secrets
    secretFiles: []

services:
  - type: web
    name: eureka-server
    runtime: image
    image:
      url: rahman5187/eureka-server:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8761"
      - key: EUREKA_HOSTNAME
        value: eureka-server.onrender.com

  - type: web
    name: api-gateway
    runtime: image
    image:
      url: rahman5187/api-gateway:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8080"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: api-gateway.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:4200,https://pharmacy-frontend.onrender.com

  - type: web
    name: user-service
    runtime: image
    image:
      url: rahman5187/user-service:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8081"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: user-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://pharmacy-postgres-syedrahman5187-pharmacy.l.aivencloud.com:28766/pharmacy_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: order-service
    runtime: image
    image:
      url: rahman5187/order-service:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8082"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: order-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://pharmacy-postgres-syedrahman5187-pharmacy.l.aivencloud.com:28766/order_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        value: fuji.lmq.cloudamqp.com
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VIRTUAL_HOST
        sync: false
      - key: RABBITMQ_SSL_ENABLED
        value: "true"
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false

  - type: web
    name: supplier-inventory-service
    runtime: image
    image:
      url: rahman5187/supplier-inventory-service:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8083"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: supplier-inventory-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://pharmacy-postgres-syedrahman5187-pharmacy.l.aivencloud.com:28766/pharmacy_inventory?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        value: fuji.lmq.cloudamqp.com
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VIRTUAL_HOST
        sync: false
      - key: RABBITMQ_SSL_ENABLED
        value: "true"
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false

  - type: web
    name: notification-service
    runtime: image
    image:
      url: rahman5187/notification-service:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8084"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: notification-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://pharmacy-postgres-syedrahman5187-pharmacy.l.aivencloud.com:28766/notification_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        value: fuji.lmq.cloudamqp.com
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VIRTUAL_HOST
        sync: false
      - key: RABBITMQ_SSL_ENABLED
        value: "true"
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false

  - type: web
    name: payment-service
    runtime: image
    image:
      url: rahman5187/payment-service:4.0.0
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_PORT
        value: "8085"
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/
      - key: EUREKA_PREFER_IP_ADDRESS
        value: "false"
      - key: EUREKA_HTTP_ENABLED
        value: "false"
      - key: EUREKA_HTTPS_ENABLED
        value: "true"
      - key: EUREKA_HOSTNAME
        value: payment-service.onrender.com
      - key: DB_URL
        value: jdbc:postgresql://pharmacy-postgres-syedrahman5187-pharmacy.l.aivencloud.com:28766/payment_db?sslmode=require
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: RABBITMQ_HOST
        value: fuji.lmq.cloudamqp.com
      - key: RABBITMQ_PORT
        value: "5671"
      - key: RABBITMQ_USERNAME
        sync: false
      - key: RABBITMQ_PASSWORD
        sync: false
      - key: RABBITMQ_VIRTUAL_HOST
        sync: false
      - key: RABBITMQ_SSL_ENABLED
        value: "true"
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: pharmacy-frontend
    runtime: node
    repo: https://github.com/rahman-2503/-pharmacy-frontend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
    routes:
      - type: rewrite
        source: /*
        destination: /index.html