# Server configuration
server.port=${SERVER_PORT:8081}
spring.application.name=USER-SERVICE

# Eureka client configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP_ADDRESS:true}
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.non-secure-port-enabled=${EUREKA_HTTP_ENABLED:true}
eureka.instance.secure-port-enabled=${EUREKA_HTTPS_ENABLED:false}
eureka.instance.secure-port=443

# Database configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pharmacy_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=10

# Actuator
management.endpoints.web.exposure.include=health

# JWT secret key
jwt.secret=${JWT_SECRET:architect-evaluation-secure-key-1234567890123456}
